<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>추억의 오락실</title>
<meta name="description" content="그 시절 오락실과 게임기에서 하던 게임을 브라우저로. 매주 한 편씩 늘어납니다.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://heiscool4u.github.io/retro-arcade/">
<meta property="og:title" content="추억의 오락실">
<meta property="og:description" content="그 시절 오락실과 게임기에서 하던 게임을 브라우저로. 매주 한 편씩 늘어납니다.">
<meta property="og:image" content="https://heiscool4u.github.io/retro-arcade/games/01-block-stack/og.png">
<meta name="theme-color" content="#0a0c18">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css">
<style>
:root{--bg:#0a0c18;--panel:#10132a;--line:#343a74;--ink:#eef0ff;--dim:#8d93c4;--yellow:#ffd84a;--red:#e8455a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font-family:Galmuri11,monospace;word-break:keep-all;
  background:radial-gradient(ellipse at 50% 0%,#1b2046 0%,var(--bg) 62%) fixed,var(--bg)}
main{max-width:880px;margin:0 auto;padding:48px 16px 64px}
h1{font-family:Galmuri14,Galmuri11,monospace;font-weight:400;font-size:clamp(28px,6vw,44px);
  margin:0 0 10px;color:var(--yellow);text-shadow:3px 3px 0 #000}
.lead{color:var(--dim);margin:0 0 36px;line-height:1.7}
.games{list-style:none;margin:0;padding:0;display:grid;gap:20px}
.game{display:grid;grid-template-columns:minmax(0,260px) 1fr;gap:22px;align-items:center;
  background:var(--panel);border:2px solid var(--line);border-radius:8px;padding:16px;
  color:inherit;text-decoration:none}
a.game:hover,a.game:focus-visible{border-color:var(--yellow);outline:none}
.game img{display:block;width:100%;height:auto;border-radius:4px}
.no{color:var(--dim);font-size:13px}
.game h2{font-weight:400;font-size:22px;margin:6px 0 10px}
.game p{color:var(--dim);line-height:1.7;margin:0 0 16px}
.play{display:inline-block;background:var(--red);color:#fff;border:2px solid #8e2232;border-bottom-width:4px;
  border-radius:4px;padding:6px 18px}
.soon{border-style:dashed;grid-template-columns:1fr;text-align:center;color:var(--dim);padding:28px 16px}
footer{color:var(--dim);font-size:12px;margin-top:40px}
@media (max-width:560px){.game{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
  <h1>추억의 오락실</h1>
  <p class="lead">그 시절 오락실과 게임기에서 하던 게임을 브라우저로 옮겨 왔습니다.<br>PC는 키보드로, 휴대폰은 화면 버튼으로 할 수 있어요. 매주 한 편씩 늘어납니다.</p>

  <ul class="games">
    <li>
      <a class="game" href="games/01-block-stack/">
        <img src="games/01-block-stack/og.png" width="1200" height="630" alt="블록 쌓기 게임 화면">
        <div>
          <span class="no">No.01</span>
          <h2>블록 쌓기</h2>
          <p>10줄마다 빨라지는 무한 모드와, 바닥에 블록이 깔린 채 시작하는 스테이지 모드.</p>
          <span class="play">플레이 ▶</span>
        </div>
      </a>
    </li>
    <li class="game soon">No.02 · 다음 주에 새 게임이 들어옵니다</li>
  </ul>

  <footer>추억의 오락실 · 효과음과 배경음은 모두 직접 합성했습니다.</footer>
</main>
</body>
</html>
